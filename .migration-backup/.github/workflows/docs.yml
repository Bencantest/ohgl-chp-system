name: Documentation Validation

on:
  push:
    paths:
      - 'docs/**'
      - 'deployments/**'
      - 'README.md'
      - 'scripts/validate-docs.mjs'
  pull_request:
    paths:
      - 'docs/**'
      - 'deployments/**'
      - 'README.md'
      - 'scripts/validate-docs.mjs'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Validate required docs, links, and Mermaid fences
        run: npm run validate:docs

