name: Migration Validation

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/*.sql'
      - 'scripts/validate-migrations.mjs'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/*.sql'
      - 'scripts/validate-migrations.mjs'

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Validate migration naming and safety checks
        run: npm run validate:migrations

