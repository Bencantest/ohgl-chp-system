name: Migration Validation

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate-migrations.mjs'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/validate-migrations.mjs'

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate migration naming and safety checks
        run: node scripts/validate-migrations.mjs
